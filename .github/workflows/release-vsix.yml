name: Release VS Code extension

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to test and publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify tag matches package version
        run: |
          package_version=$(node -p "require('./package.json').version")
          tag_version=${RELEASE_TAG#v}
          if [[ "$tag_version" =~ ^[0-9]+\.[0-9]+$ ]]; then
            tag_version="$tag_version.0"
          fi
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version $package_version"
            exit 1
          fi

      - run: npm ci
      - run: xvfb-run -a npm test
      - run: npm run vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vscode-extension
          path: release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/*.vsix \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/*.vsix \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
