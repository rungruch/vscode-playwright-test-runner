name: Validate extension

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run benchmark:core
      - run: xvfb-run -a npm run test:extension
        if: runner.os == 'Linux'
      - run: npm run test:extension
        if: runner.os != 'Linux'
